[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mangadotnet-scraper"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "questionary>=2.1.1",
    "aiohttp>=3.14.3",
    "aiodns>=4.0.4",
    "asynciolimiter>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "camoufox>=0.5.5",
    "playwright-captcha==0.1.1"
]

[project.optional-dependencies]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.5",
    "camoufox[gui]>=0.5.5"
]

[project.scripts]
mangadotnet_scraper = "mangadotnet_scraper:initialize"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]

treat-all-caps-as-final = true

[tool.ruff]
line-length = 120