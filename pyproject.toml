[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "mangadotnet-scraper"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "questionary>=2.1.1",
    "aiohttp[speedups]>=3.14.3",
    "asynciolimiter>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "camoufox>=0.5.5",
    "playwright-captcha==0.1.1",
    "cysqlite>=0.4.0",
    "pyotp>=2.10.0",
    "pillow>=13.0.0",
    "pillow-jxl-plugin>=1.3.8",
    "uvloop>=0.23.0; sys_platform == 'linux'",
]

[project.scripts]
mangadotnet_scraper = "mangadotnet_scraper:initialize"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.5"
]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]

treat-all-caps-as-final = true

[tool.ruff]
line-length = 79